<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brant Niven</title>
<style>
  :root{
    --ink:#0e0e12;
    --paper:#f5f2ea;
    --pink:#ff3d7f;
    --yellow:#ffd23f;
    --blue:#3fc1ff;
    --green:#37e0a5;
    --purple:#8b5cf6;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--ink);
    font-family:'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    color:var(--paper);
    overflow-x:hidden;
  }

  body{
    position:relative;
    display:flex;
    justify-content:center;
    padding:0 0 60px;
  }

  /* animated rainbow strip behind everything, echoing the jersey */
  .rainbow-strip{
    position:fixed;
    inset:0;
    background:linear-gradient(115deg,
      var(--pink) 0%, var(--yellow) 20%, var(--green) 40%,
      var(--blue) 60%, var(--purple) 80%, var(--pink) 100%);
    background-size:400% 400%;
    opacity:0.16;
    animation:drift 18s ease-in-out infinite;
    z-index:0;
  }

  @keyframes drift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    padding:28px 22px 0;
  }

  .frame{
    position:relative;
    border-radius:28px;
    padding:6px;
    background:linear-gradient(135deg,var(--pink),var(--yellow),var(--green),var(--blue),var(--purple));
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .photo-wrap{
    border-radius:24px;
    overflow:hidden;
    background:#111;
    aspect-ratio:3/4;
  }

  .photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .checker{
    height:14px;
    width:100%;
    background-image:
      linear-gradient(45deg, var(--ink) 25%, transparent 25%),
      linear-gradient(-45deg, var(--ink) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--ink) 75%),
      linear-gradient(-45deg, transparent 75%, var(--ink) 75%);
    background-size:14px 14px;
    background-position: 0 0, 0 7px, 7px -7px, -7px 0px;
    background-color:var(--paper);
    border-radius:0 0 22px 22px;
    margin-top:-4px;
    position:relative;
    z-index:2;
  }

  .name-block{
    text-align:center;
    margin-top:26px;
  }

  .name-block h1{
    font-size:2rem;
    line-height:1.05;
    margin:0;
    font-weight:700;
    letter-spacing:-0.02em;
  }

  .name-block .tag{
    display:inline-block;
    margin-top:10px;
    padding:6px 16px;
    border-radius:999px;
    font-size:0.85rem;
    font-weight:600;
    color:var(--ink);
    background:var(--yellow);
    transform:rotate(-2deg);
  }

  .links{
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:var(--ink);
    padding:16px 20px;
    border-radius:18px;
    font-weight:700;
    font-size:1.05rem;
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  .link-btn:active{
    transform:translate(4px,4px);
    box-shadow:2px 2px 0 var(--ink);
  }

  .link-btn .icon{
    width:38px;
    height:38px;
    flex:none;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn .icon svg{
    width:22px;
    height:22px;
  }

  .link-btn .label{
    display:flex;
    flex-direction:column;
    line-height:1.2;
  }

  .link-btn .label small{
    font-weight:500;
    font-size:0.75rem;
    opacity:0.6;
  }

  .snap .icon{background:var(--yellow);}
  .insta .icon{background:linear-gradient(135deg,var(--pink),var(--purple));}
  .insta .icon svg{fill:white;}
  .snap .icon svg{fill:var(--ink);}

  footer{
    text-align:center;
    margin-top:38px;
    font-size:0.75rem;
    opacity:0.4;
    letter-spacing:0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .rainbow-strip{animation:none;}
  }
</style>
</head>
